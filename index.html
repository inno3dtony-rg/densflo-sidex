<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INNO3D · SIDEX 2026</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: linear-gradient(150deg,
        #074D9D 0%,
        #1B5FAC 35%,
        #007DD5 70%,
        #4AAEE8 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .wrap {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    .title-area { text-align: center; }

    .eyebrow {
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .title {
      color: #FFFFFF;
      font-size: clamp(30px, 8vw, 44px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
    }

    .sub {
      color: rgba(255,255,255,0.60);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.8;
    }

    .btn-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 22px 28px;
      border-radius: 18px;
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .btn:hover  { transform: translateY(-4px); }
    .btn:active { transform: translateY(-1px); }

    /* 홍보 영상 — 흰색 */
    .btn-video {
      background: #FFFFFF;
      color: #074D9D;
      box-shadow: 0 10px 36px rgba(7,77,157,0.35);
    }
    .btn-video:hover { box-shadow: 0 18px 48px rgba(7,77,157,0.45); }

    /* 데모 신청 — 반투명 */
    .btn-demo {
      background: rgba(255,255,255,0.13);
      color: #FFFFFF;
      border: 1.5px solid rgba(255,255,255,0.38);
      box-shadow: 0 10px 36px rgba(7,77,157,0.20);
      backdrop-filter: blur(12px);
    }
    .btn-demo:hover {
      background: rgba(255,255,255,0.20);
      box-shadow: 0 18px 48px rgba(7,77,157,0.30);
    }

    /* 리플렛 보기 — 반투명 */
    .btn-leaflet {
      background: rgba(255,255,255,0.13);
      color: #FFFFFF;
      border: 1.5px solid rgba(255,255,255,0.38);
      box-shadow: 0 10px 36px rgba(7,77,157,0.20);
      backdrop-filter: blur(12px);
    }
    .btn-leaflet:hover {
      background: rgba(255,255,255,0.20);
      box-shadow: 0 18px 48px rgba(7,77,157,0.30);
    }

    .footer-note {
      color: rgba(255,255,255,0.38);
      font-size: 12px;
      font-weight: 400;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="title-area">
      <p class="eyebrow">SIDEX 2026</p>
      <h1 class="title">디지털 덴티스트리의<br>새로운 기준</h1>
      <p class="sub">Densflo Scan · Densflo Codi</p>
    </div>

    <div class="btn-group">

      <!-- 홍보 영상 -->
      <button class="btn btn-video"
        onclick="window.location.href='https://www.youtube.com/@INNO3Dmarketing'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#FF0000">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1C4.5 20.4 12 20.4 12 20.4s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/>
        </svg>
        홍보 영상 보기
      </button>

      <!-- 데모 신청 -->
      <button class="btn btn-demo"
        onclick="window.location.href='https://forms.gle/pcGDpr1dGEruw4Ki7'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        데모 신청하기
      </button>

      <!-- 리플렛 보기 -->
      <button class="btn btn-leaflet"
        onclick="window.location.href='https://drive.google.com/drive/folders/1xmbfFDqXrYGYblNO0jtfdPOEsBSTQAH5?usp=sharing'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="15" y2="17"/>
        </svg>
        리플렛 보기
      </button>

    </div>

    <p class="footer-note">
      sales@inno3d.co.kr · 02-6952-0693
    </p>

  </div>
</body>
</html>
